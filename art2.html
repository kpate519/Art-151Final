<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Letters in Flight - Riddle Game</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    .flight-exhibit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 500px; /* Increased canvas size */
      height: 500px;
      background-color: #E3DAFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
    }

    a {
      margin-top: 20px;
      color: #00F0B5;
      text-decoration: none;
    }

    #secret-message {
      margin-top: 20px;
      color: #00F0B5;
      display: none;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🌟 Letters in Flight</h1>
  <p>Riddle: "I am the beginning of everything, the start of time, and the end of space. I am infinite, but you can't see me. What am I?"</p>
  <div class="flight-exhibit">
    <div class="canvas-container"></div>
  </div>

  <p id="secret-message">🎉 Congratulations! The secret message is: "Infinity" 🎉</p>


  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script>
const lettersFlight = (p) => {
  let letters = [];
  let alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".repeat(3); // 3x alphabet
  let correctLetters = ['I', 'N', 'F', 'I', 'N', 'I', 'T', 'Y'];
  let clickedLetters = [];
  let currentIndex = 0;

  p.setup = function () {
    const container = document.querySelector('.flight-exhibit .canvas-container');
    const canvas = p.createCanvas(500, 500);
    canvas.parent(container);
    canvas.elt.style.borderRadius = "12px";

    for (let i = 0; i < alphabet.length; i++) {
      letters.push({
        char: alphabet[i],
        x: p.random(p.width),
        y: p.random(p.height - 60), // Keep letters above bottom area
        vx: p.random(-0.7, 0.7),
        vy: p.random(-0.7, 0.7),
        isClicked: false
      });
    }

    p.textFont('monospace');
    p.textSize(32);
    p.noStroke();
  };

  p.draw = function () {
    p.background('#E3DAFF');

    // Draw a rectangle at the bottom for selected letters
    p.fill('#283044');
    p.rect(0, p.height - 60, p.width, 60);

    // Show flying letters
    for (let l of letters) {
      p.fill(l.isClicked ? '#D81E5B' : '#283044');
      p.text(l.char, l.x, l.y);

      if (!l.isClicked) {
        l.x += l.vx;
        l.y += l.vy;

        if (l.x < 0 || l.x > p.width - 20) l.vx *= -1;
        if (l.y < 30 || l.y > p.height - 60) l.vy *= -1; // Bounce within upper region
      }
    }

    // Display selected letters in bottom bar
    p.fill('#FED766');
    p.textSize(24);
    p.textAlign(p.LEFT, p.CENTER);
    p.text("Selected: " + clickedLetters.join(" "), 10, p.height - 30);

    // Reveal secret message
    if (clickedLetters.join("") === correctLetters.join("")) {
      document.getElementById('secret-message').style.display = 'block';
    }
  };

  p.mousePressed = function () {
    letters.forEach((letter) => {
      if (
        p.dist(p.mouseX, p.mouseY, letter.x, letter.y) < 20 &&
        !letter.isClicked &&
        letter.char === correctLetters[currentIndex]
      ) {
        letter.isClicked = true;
        letter.vx = 0;
        letter.vy = 0;
        clickedLetters.push(letter.char);
        currentIndex++;
      }
    });
  };
};

new p5(lettersFlight);



  </script>
    <a href="gallery.html">← Back to Gallery</a>
    <audio id="background-music" src="emotionalPiano.mp3" loop autoplay></audio>

</body>
</html>
