<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instructions Not Included</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #fdf6e3;
      margin: 0;
      padding: 40px;
      text-align: center;
      transition: transform 0.1s linear; /* Smooth transition for rotating */
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .frame {
      display: inline-block;
      padding: 15px;
      background: #fff;
      border: 10px solid #555;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    iframe, canvas {
      display: block;
      max-width: 100%;
      margin: auto;
    }

    .description {
      max-width: 600px;
      margin: 0 auto;
      font-size: 1rem;
      color: #333;
    }

    .back-link {
      display: block;
      margin-top: 40px;
      text-decoration: none;
      color: #888;
    }

    .back-link:hover {
      color: #000;
    }
  </style>
  <audio id="background-music" src="emotionalPiano.mp3" loop autoplay></audio>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
  <h1> Instructions Not Included</h1>
  <script>
let shapes = [];
let bgColor;
let cursorVisible = false;
let rotationAngle = 0; // The angle of rotation for the page
let rotationSpeed = 1; // Initial speed of rotation
let rotating = false; // Whether the page is rotating or not

function setup() {
  createCanvas(windowWidth, windowHeight);
  bgColor = color(20, 20, 30);
  textFont('monospace');
  textAlign(CENTER, CENTER);
  
  // Hide the cursor initially
  noCursor();
}

function draw() {
  background(bgColor);

  // Draw evolving title
  push();
  fill(255);
  pop();

  // Display all shapes
  for (let s of shapes) {
    s.update();
    s.display();
  }

  // Random color flicker
  if (frameCount % 300 === 0) {
    bgColor = color(random(10, 50), random(10, 50), random(30, 80));
  }

  // If rotating, increase the rotation angle
  if (rotating) {
    rotationAngle += rotationSpeed;
    document.body.style.transform = 'rotate(' + rotationAngle + 'deg)';
  }
}

function mousePressed() {
  shapes.push(new StrangeShape(mouseX, mouseY));
}

function keyPressed() {
  if (key === ' ') {
    // Space bar is pressed: Start or speed up the rotation
    rotating = true;  // Start rotating
    rotationSpeed += 1; // Increase the rotation speed with each press
  } else if (key === 'Enter') {
    // Enter key is pressed: Stop the rotation
    rotating = false;
    rotationSpeed = 1;  // Reset the rotation speed
    document.body.style.transform = 'rotate(0deg)'; // Reset rotation angle
  }

  // Handle typing specific characters like before
  let char = key.toUpperCase();
  if (char === 'A') {
    shapes.push(new StrangeShape(random(width), random(height), '^'));
  } else if (char === 'B') {
    shapes.push(new StrangeShape(random(width), random(height), '='));
  } else if (char === 'C') {
    shapes.push(new StrangeShape(random(width), random(height), '-'));
  }else if (char === 'D') {
    shapes.push(new StrangeShape(random(width), random(height), '@'));
  } else if (char === 'E') {
    shapes.push(new StrangeShape(random(width), random(height), '@'));
  }else if (char === 'F') {
    shapes.push(new StrangeShape(random(width), random(height), '#'));
  } else if (char === 'G') {
    shapes.push(new StrangeShape(random(width), random(height), '&'));
  }else if (char === 'H') {
    shapes.push(new StrangeShape(random(width), random(height), '&'));
  } else if (char === 'I') {
    shapes.push(new StrangeShape(random(width), random(height), '>'));
  }else if (char === 'J') {
    shapes.push(new StrangeShape(random(width), random(height), '??'));
  } else if (char === 'K') {
    shapes.push(new StrangeShape(random(width), random(height), '<'));
  }else if (char === 'L') {
    shapes.push(new StrangeShape(random(width), random(height), ';'));
  } else if (char === 'M') {
    shapes.push(new StrangeShape(random(width), random(height), ';'));
  }else if (char === 'N') {
    shapes.push(new StrangeShape(random(width), random(height), ')'));
  } else if (char === 'O') {
    shapes.push(new StrangeShape(random(width), random(height), '('));
  }else if (char === 'P') {
    shapes.push(new StrangeShape(random(width), random(height), '%'));
  } else if (char === 'Q') {
    shapes.push(new StrangeShape(random(width), random(height), '3'));
  }else if (char === 'R') {
    shapes.push(new StrangeShape(random(width), random(height), '$'));
  } else if (char === 'S') {
    shapes.push(new StrangeShape(random(width), random(height), '&'));
  }else if (char === 'T') {
    shapes.push(new StrangeShape(random(width), random(height), '6'));
  } else if (char === 'U') {
    shapes.push(new StrangeShape(random(width), random(height), '5'));
  }else if (char === 'V') {
    shapes.push(new StrangeShape(random(width), random(height), '4'));
  } else if (char === 'W') {
    shapes.push(new StrangeShape(random(width), random(height), '3'));
  }else if (char === 'X') {
    shapes.push(new StrangeShape(random(width), random(height), '2'));
  } else if (char === 'Y') {
    shapes.push(new StrangeShape(random(width), random(height), '1'));
  }else if (char === 'Z') {
    shapes.push(new StrangeShape(random(width), random(height), '!'));
  } else if (char === '1') {
    shapes.push(new StrangeShape(random(width), random(height), 'k'));
  }else if (char === '2') {
    shapes.push(new StrangeShape(random(width), random(height), 'j'));
  } else if (char === '3') {
    shapes.push(new StrangeShape(random(width), random(height), 'i'));
  }else if (char === '4') {
    shapes.push(new StrangeShape(random(width), random(height), 'h'));
  } else if (char === '5') {
    shapes.push(new StrangeShape(random(width), random(height), 'g'));
  }else if (char === '6') {
    shapes.push(new StrangeShape(random(width), random(height), 'f'));
  } else if (char === '7') {
    shapes.push(new StrangeShape(random(width), random(height), 'd'));
  }else if (char === '8') {
    shapes.push(new StrangeShape(random(width), random(height), 'c'));
  } else if (char === '9') {
    shapes.push(new StrangeShape(random(width), random(height), 'b'));
  }else if (char === '0') {
    shapes.push(new StrangeShape(random(width), random(height), 'a'));
  } 
  // Add more key press logic as you need...
}

class StrangeShape {
  constructor(x, y, symbol) {
    this.x = x;
    this.y = y;
    this.size = random(10, 40);
    this.color = color(random(255), random(255), random(255), 150);
    this.type = int(random(3));
    this.vx = random(-2, 2);
    this.vy = random(-2, 2);
    this.symbol = symbol || '';
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.size += sin(frameCount * 0.05) * 0.5;
  }

  display() {
    fill(this.color);
    noStroke();
    if (this.type === 0) {
      ellipse(this.x, this.y, this.size);
    } else if (this.type === 1) {
      rect(this.x, this.y, this.size, this.size);
    } else {
      push();
      translate(this.x, this.y);
      rotate(frameCount * 0.01);
      triangle(-this.size / 2, this.size / 2, 0, -this.size, this.size / 2, this.size / 2);
      pop();
    }
    
    // Display the symbol for the typed key
    if (this.symbol) {
      fill(255);
      textSize(32);
      text(this.symbol, this.x, this.y);
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
  </script>

</body>
</html>
